spring:
  application:
    name: qiyu-live-video-provider
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 50
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qiyu_live_video?useUnicode=true&characterEncoding=utf8
    username: root
    password: 123456
  main:
    web-application-type: none
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      id-type: auto

qiyu:
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    video-bucket: qiyu-live-videos
    public-endpoint: http://192.168.31.252:3000/minio
  rmq:
    consumer:
      nameSrv: 127.0.0.1:9876
      groupName: qiyuLiveMqApplication
    producer:
      nameSrv: 127.0.0.1:9876
      groupName: ${spring.application.name}
      retryTimes: 2

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://127.0.0.1:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=nacos&&password=nacos
  protocol:
    name: dubbo
    port: 30060
    threads: 200
  consumer:
    timeout: 5000
    check: false
