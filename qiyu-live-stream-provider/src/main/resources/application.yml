spring:
  application:
    name: qiyu-live-stream-provider
  datasource:
    hikari:
      minimum-idle: 10
      maximum-pool-size: 200
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qiyu_live_living?useUnicode=true&characterEncoding=utf8
    username: root
    password: 123456
  data:
    redis:
      port: 6379
      host: 127.0.0.1

# HTTP 端口：SRS 的 on_publish / on_unpublish 回调打到这个端口
server:
  port: 38090

qiyu:
  srs:
    host: 127.0.0.1
    rtmp-port: 1935
    api-port: 1985
    rtc-udp-port: 8000   # WebRTC UDP 端口（与容器同名映射）
    hls-port: 8080
    secret: your_secret_key_here
    callback-secret: ''  # 留空则跳过回调校验；SRS 默认不带 X-Srs-Secret 头
    # dvr-container-prefix / dvr-local-dir 使用代码默认值：
    #   /data/dvr（容器内，对应 srs.conf 的 dvr_path）→ ./docker-data/srs/dvr（宿主机挂载目录）
    # 仅当改用本机原生 SRS 时才需要覆盖这两个值
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: qiyu-live-records
    # 局域网内其他设备访问封面/回放使用的地址；留空则用 endpoint(127.0.0.1，仅本机可见)
    # 走 vite(3000) 的 /minio 代理：Windows 防火墙拦 9000 直连；生产环境用 nginx/gateway 同理
    public-endpoint: http://192.168.31.252:3000/minio

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://127.0.0.1:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=nacos&&password=nacos
  protocol:
    name: dubbo
    port: 30065
