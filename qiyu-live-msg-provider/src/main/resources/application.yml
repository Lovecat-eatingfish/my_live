spring:
  application:
    name: qiyu-live-msg-provider
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: ef63e53e-94c8-4b1c-865e-6824177b2893
        username: nacos
        password: ${NACOS_PASSWORD:nacos}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # qiyu-live-msg
    url: jdbc:mysql://127.0.0.1:3306/qiyu-live-msg?useUnicode=true&characterEncoding=utf8
    username: ${QIYU_MYSQL_USERNAME:root}
    password: ${QIYU_MYSQL_PASSWORD:123456}
  data:
    redis:
      port: 6379
      host: 127.0.0.1
      lettuce:
        pool:
          min-idle: 10
          max-active: 100
          max-idle: 10

dubbo:
  consumer:
    timeout: 5000
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://127.0.0.1:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=${NACOS_USERNAME:nacos}&&password=${NACOS_PASSWORD:nacos}
  protocol:
    name: dubbo
    port: 30050

qiyu:
  rmq:
    producer:
      nameSrv: 127.0.0.1:9876
      groupName: ${spring.application.name}
      applicationName: ${spring.application.name}
      sendMsgTimeout: 3000
      retryTimes: 2
    consumer:
      nameSrv: 127.0.0.1:9876
      groupName: qiyuLiveMqApplication
  sms:
    # 测试模式：验证码固定 123456、不真实发送短信。上线前必须置 false（或设环境变量 QIYU_SMS_MOCK_ENABLED=false）
    mock-code-enabled: ${QIYU_SMS_MOCK_ENABLED:true}
    mock-code: ${QIYU_SMS_MOCK_CODE:123456}
    ccp:
      smsServerIp: app.cloopen.com
      port: 8883
      accountSId: [容联云上的accountSID]
      accountToken: [容联云上的Token]
      appId: [容联云上的appId]
      templateId: 1
      testPhone: 13510647925
