<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旗鱼直播</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
<script>
      // 深色模式：跟随系统 + localStorage 记忆（Element Plus dark 变量）
      (function darkModeInit() {
        var saved = localStorage.getItem('qiyu_dark');
        var dark = saved !== null ? saved === '1' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </body>
</html>
