# 旗鱼直播前端（生产容器化）
# 与 vite dev 代理保持一致：/api → 网关，/minio → MinIO，/rtc → SRS HTTP API
# 上游用变量 + Docker 内置 DNS(127.0.0.11)：上游容器未就绪时 nginx 也能先启动
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 320m;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_upstream http://gateway:38080;
        proxy_pass $gateway_upstream/live/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /minio/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream/;
        proxy_set_header Host $host;
    }

    # SRS WebRTC 信令（Linux 宿主机场景；Windows 请使用原生 srs.exe 并代理到宿主机）
    location /rtc/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $srs_upstream http://srs:1985;
        proxy_pass $srs_upstream/;
        proxy_set_header Host $host;
    }
}
