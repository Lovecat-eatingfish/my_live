spring:
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 310MB
  application:
    name: qiyu-live-api
  data:
    redis:
      port: 6379
      host: 127.0.0.1
      lettuce:
        pool:
          min-idle: 10
          max-active: 100
          max-idle: 10

dubbo:
  consumer:
    timeout: 5000
  application:
    name: qiyu-live-api
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=nacos&&password=nacos

server:
  port: 38085
  servlet:
    context-path: /live/api
  tomcat:
    uri-encoding: UTF-8
    max-threads: 500
    min-spare-threads: 20
    max-connections: 500

qiyu:
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    video-bucket: qiyu-live-videos
    # dev 走 vite /minio 代理；生产为 nginx/gateway 地址
    public-endpoint: http://192.168.31.252:3000/minio
  im:
    # im-core-server 的 Netty 端口，与 qiyu-live-im-core-server 的 application.yml 保持一致
    ws-port: 38115
    tcp-port: 38110
  rmq:
    producer:
      nameSrv: 127.0.0.1:9876
      groupName: ${spring.application.name}
      applicationName: ${spring.application.name}
      sendMsgTimeout: 3000
      retryTimes: 2
