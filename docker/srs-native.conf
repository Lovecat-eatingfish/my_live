# 旗鱼直播 SRS - Windows 本机原生运行配置
# 背景：Docker Desktop 的 UDP 端口转发丢包严重（WebRTC 握手超时），
#       host 网络模式在本机 Docker Desktop 上对 Windows 不可达，
#       因此本机开发改用原生 srs.exe + 本配置文件。
# 启动（cmd）:
#   set CANDIDATE=192.168.31.252
#   D:\softwarepackage\development\srs_v5\SRS\objs\srs.exe -c D:\javacode\qiyu-live-app\docker\srs-native.conf
# 与 docker/srs.conf 的差异：仅 dvr_path 改为 Windows 路径；hooks 固定 127.0.0.1:38090
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
    tcp {
        enabled         on;
        listen          8000;
        protocol        webrtc;
    }
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
    }
    rtc {
        enabled         on;
        rtc_to_rtmp     on;
        rtmp_to_rtc     on;
    }
    dvr {
        enabled         on;
        dvr_plan        session;
        dvr_path        ./objs/dvr/[stream]/[timestamp].flv;
    }
    http_hooks {
        enabled         on;
        on_publish      http://127.0.0.1:38090/api/stream/on_publish;
        on_unpublish    http://127.0.0.1:38090/api/stream/on_unpublish;
        on_dvr          http://127.0.0.1:38090/api/stream/on_dvr;
    }
}
