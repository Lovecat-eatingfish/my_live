# 旗鱼直播 SRS 4 配置
# 在默认能力(RTMP 1935 / HTTP API 1985 / HTTP 分发 8080)之上开启:
#   1. HLS 切片
#   2. DVR 录制为 FLV（关播落盘 -> on_dvr 回调 -> 上传 MinIO）
#   3. WebRTC 推拉流（浏览器一键开播），rtc_to_rtmp 桥接回 RTMP 复用 HLS/DVR 链路
#   4. http_hooks 推流回调 -> 宿主机 qiyu-live-stream-provider (38090)
# candidate 通过环境变量 CANDIDATE 注入（docker-compose），本机开发用 127.0.0.1，
# 局域网观看看改成宿主机局域网 IP
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       trace;

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
    # SRS 5: WebRTC over TCP，绕过 Docker Desktop UDP 转发丢包问题
    tcp {
        enabled         on;
        listen          8000;
        protocol        webrtc;
    }
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
    }
    rtc {
        enabled         on;
        # 浏览器 WebRTC 推流 -> 桥接为 RTMP 流，复用 HLS/DVR/录制链路
        rtc_to_rtmp     on;
        rtmp_to_rtc     on;
    }
    dvr {
        enabled         on;
        dvr_plan        session;
        # SRS 4 无 dvr_format 指令（SRS 5 才有），格式由 dvr_path 扩展名决定
        # 录制为 FLV，前端用 flv.js 播放
        dvr_path        /data/dvr/[stream]/[timestamp].flv;
    }
    http_hooks {
        enabled         on;
        # host 网络模式（Docker Desktop EnableHostNetworking）下容器共享宿主机回环，直接用 127.0.0.1
        # 若改回端口映射模式，需换成 http://host.docker.internal:38090/...
        on_publish      http://127.0.0.1:38090/api/stream/on_publish;
        on_unpublish    http://127.0.0.1:38090/api/stream/on_unpublish;
        on_dvr          http://127.0.0.1:38090/api/stream/on_dvr;
    }
}
