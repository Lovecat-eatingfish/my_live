spring:
  application:
    name: qiyu-live-admin-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qiyu_live_common?useUnicode=true&characterEncoding=utf8
    username: ${QIYU_MYSQL_USERNAME:root}
    password: ${QIYU_MYSQL_PASSWORD:123456}

dubbo:
  application:
    name: qiyu-live-admin-api
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=${NACOS_USERNAME:nacos}&&password=${NACOS_PASSWORD:nacos}
  consumer:
    timeout: 5000
    check: false

server:
  port: 38100
  servlet:
    context-path: /live/admin
