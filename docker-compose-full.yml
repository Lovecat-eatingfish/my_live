        --spring.cloud.nacos.discovery.namespace=ef63e53e-94c8-4b1c-865e-6824177b2893
        --spring.cloud.nacos.discovery.username=nacos
        --spring.cloud.nacos.discovery.password=nacos
        --dubbo.registry.address=nacos://nacos:8848?namespace=ef63e53e-94c8-4b1c-865e-6824177b2893&&username=nacos&&password=nacos
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/qiyu_live_common?useUnicode=true&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"

  im-provider:
