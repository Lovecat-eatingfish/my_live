# 旗鱼直播 - 全量容器化一键启动（中间件 + 全部 Java 服务 + 前端）
#
# 与 docker-compose.yml（仅中间件）的关系：
#   - 本机 Windows 开发：继续用 docker-compose.yml + 原生 srs.exe + 本机跑 Java jar
#     （Docker Desktop UDP 转发丢包，WebRTC 推拉流在容器里不可用，见 troubleshooting §7）
#   - Linux 服务器/演示环境：用本文件全量容器化
#       mvn clean package -DskipTests          # 先出全量 jar
#       bash scripts/build-images.sh dev       # 构建全部服务镜像
#       cd web_live && npm i && npm run build && docker build -t qiyu-live/web-front:dev .  # 前端镜像
#       docker compose -f docker-compose-full.yml up -d
#   - 访问入口: 前端 http://<host>/ （nginx 已代理 /api → 网关、/minio → MinIO、/rtc → SRS）
#
# 说明：
#   - 服务间地址全部用 compose 服务名覆盖（SPRING_DATASOURCE_URL / DUBBO_REGISTRY_ADDRESS 等
#     环境变量优先级高于 jar 内配置文件，无需改代码）
#   - provider 的 Dubbo 端口不映射到宿主机：调用方都走容器网络内部直连
#   - Java 服务 restart: unless-stopped：下游未就绪时自检失败自动重启，直至全链路拉起
# 你这份 `docker-compose-full.yml` **没有显式写 `networks`，但 docker-compose 会自动创建默认网络！**
#> Compose 默认行为：只要你不手动定义 networks，启动时自动新建一个 `项目名_default` bridge 网络，**所有 service 默认加入这个网络**。
#> 所以容器之间可以直接用服务名互相访问（`mysql`、`nacos`、`redis` 这种域名，就是靠这个 compose 内置网络实现），**不需要额外配置**。

services:
  # ===================== 中间件（与 docker-compose.yml 一致） =====================
  mysql:
    image: hotelinking/mysql8.0:latest
    container_name: qiyu-full-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/full-mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:latest
    container_name: qiyu-full-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/full-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.2.1
    container_name: qiyu-full-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: "qiyu"
      NACOS_AUTH_IDENTITY_VALUE: "qiyu"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./docker-data/full-nacos:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ -o /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    container_name: qiyu-full-rmqnamesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:5.3.2
    container_name: qiyu-full-rmqbroker
    restart: unless-stopped
    depends_on:
      - rmqnamesrv
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: "rmqnamesrv:9876"
    volumes:
      - ./docker/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf

  # ⚠️ Windows 宿主机调试 WebRTC 请继续用原生 srs.exe（见 docker/srs-native.conf）
  srs:
    image: ossrs/srs:5
    container_name: qiyu-full-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/tcp"
      - "8000:8000/udp"
    environment:
      CANDIDATE: "127.0.0.1"   # 部署到服务器时改为公网/局域网 IP
    volumes:
      - ./docker-data/full-srs:/data
      - ./docker:/usr/local/srs/conf-qiyu:ro
    command: objs/srs -c conf-qiyu/srs.conf

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: qiyu-full-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "39000:9000"
      - "39001:9001"
    volumes:
      - ./docker-data/full-minio:/data
    command: server /data --console-address ":9001"

  # ===================== 基础层 provider（无 DB 依赖校验） =====================
  id-generate-provider:
    image: qiyu-live/qiyu-live-id-generate-provider:dev
    container_name: qiyu-id-generate-provider
